
name: pharmaCare-automated-qdrant-ingestion

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "knowledge_base_doc/sample_documents/**"
      - "pharma_rag/ingestion/**"
      - "pharma_rag/retrieval/**"
      - "requirements.txt"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-medical-documents:
    name: Ingest Medical PDFs into Qdrant
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Dependencies installed successfully."

      - name: Verify repository files
        run: |
          echo "Checking ingestion script..."
          ls -l pharma_rag/ingestion/cloud_ingestion.py

          echo "Checking medical documents..."
          find knowledge_base_doc/sample_documents -type f

      - name: Validate configuration
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
        run: |
          python -u -c "import os; assert os.getenv('QDRANT_API_KEY'), 'QDRANT_API_KEY is missing'; assert os.getenv('QDRANT_URL'), 'QDRANT_URL is missing'; print('Qdrant configuration validated')"

      - name: Run automated PDF ingestion
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting automated medical PDF ingestion..."
          python -u pharma_rag/ingestion/cloud_ingestion.py
          echo "Medical PDF ingestion completed successfully."
