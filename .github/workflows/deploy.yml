
name: Deploy PharmaCare AI to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Prepare lightweight Lambda package
        run: |
          mkdir -p lambda_package

          cp -r backend lambda_package/
          cp -r pharma_rag lambda_package/

          cp backend/requirements-lambda.txt \
            lambda_package/requirements.txt

          find lambda_package -type d -name "__pycache__" \
            -prune -exec rm -rf {} +

          find lambda_package -type f -name "*.pyc" -delete

      - name: Validate SAM template
        run: |
          sam validate \
            --template-file template.yml \
            --region "${{ vars.AWS_REGION }}"

      - name: Build Lambda ZIP package
        run: |
          sam build \
            --template-file template.yml

      - name: Deploy PharmaCare AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name pharmacare-ai-dev \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AnthropicApiKey="$ANTHROPIC_API_KEY" \
              QdrantApiKey="$QDRANT_API_KEY" \
              QdrantUrl="$QDRANT_URL"
