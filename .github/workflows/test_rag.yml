
name: PharmaCare RAG Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-integration-test:
    name: Test Qdrant and Claude RAG Pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-all-minilm-l6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        env:
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "import os; assert os.getenv('QDRANT_URL'), 'Missing QDRANT_URL'; assert os.getenv('QDRANT_API_KEY'), 'Missing QDRANT_API_KEY'; assert os.getenv('ANTHROPIC_API_KEY'), 'Missing ANTHROPIC_API_KEY'; print('RAG configuration validated successfully.')"

      - name: Run end-to-end RAG integration test
        env:
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u tests/smoke_test_rag.py
