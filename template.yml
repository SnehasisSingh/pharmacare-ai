
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PharmaCare AI - shared medical RAG and clinical review API

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true

  QdrantApiKey:
    Type: String
    NoEcho: true

  QdrantUrl:
    Type: String

  ClaudeModel:
    Type: String
    Default: claude-haiku-5-5

  ClinicalCasesTableName:
    Type: String
    Default: pharmacare-ai-dev-clinical-cases
    Description: Existing DynamoDB clinical cases table

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 28
    MemorySize: 1024
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        CLAUDE_MODEL: !Ref ClaudeModel
        QDRANT_API_KEY: !Ref QdrantApiKey
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_COLLECTION: medical_knowledge

Resources:

  ClinicalUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  PatientGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: patient
      UserPoolId: !Ref ClinicalUserPool

  DoctorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: doctor
      UserPoolId: !Ref ClinicalUserPool

  ClinicalUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ClinicalUserPool
      ClientName: !Sub '${AWS::StackName}-streamlit-client'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  PharmaCareApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Dev
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ClinicalUserPool.Arn
            Identity:
              Header: Authorization

  ClinicalReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-clinical-review-api'
      CodeUri: lambda_package/
      Handler: backend.clinical_review.handler.handler

      Environment:
        Variables:
          PHARMACARE_CASES_TABLE: !Ref ClinicalCasesTableName

      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ClinicalCasesTableName

      Events:

        SubmitCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /cases
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

        ReadCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /cases/{case_id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        ListCases:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /doctor/cases
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        DecideCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /doctor/cases/{case_id}
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  PharmaCareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pharmacare-ai-api
      CodeUri: lambda_package/
      Handler: backend.api.handler.lambda_handler

      Policies:
        - AWSLambdaBasicExecutionRole

      Events:

        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

        MedicalAskApi:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /medical/ask
            Method: POST
            Auth:
              Authorizer: NONE


Outputs:

  PharmaCareApiUrl:
    Description: Shared PharmaCare API Gateway URL
    Value: !Sub 'https://${PharmaCareApi}.execute-api.${AWS::Region}.amazonaws.com/Dev'

  ClinicalReviewApiUrl:
    Description: Clinical Review API URL
    Value: !Sub 'https://${PharmaCareApi}.execute-api.${AWS::Region}.amazonaws.com/Dev'

  PharmaCareFunctionName:
    Value: !Ref PharmaCareFunction

  ClinicalUserPoolId:
    Value: !Ref ClinicalUserPool

  ClinicalUserPoolClientId:
    Value: !Ref ClinicalUserPoolClient

  ClinicalCasesTableName:
    Value: !Ref ClinicalCasesTableName
