AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PharmaCare AI - public synthetic demo with two UI paths, no login
Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
  QdrantApiKey:
    Type: String
    NoEcho: true
  QdrantUrl:
    Type: String
  ClaudeModel:
    Type: String
    Default: claude-haiku-5-5
  ClinicalCasesTableName:
    Type: String
    Default: pharmacare-ai-dev-clinical-cases
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 28
    MemorySize: 1024
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        CLAUDE_MODEL: !Ref ClaudeModel
        QDRANT_API_KEY: !Ref QdrantApiKey
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_COLLECTION: medical_knowledge
Resources:
  PharmaCareApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Dev
  PharmaCareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pharmacare-ai-api
      CodeUri: lambda_package/
      Handler: backend.api.handler.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /health
            Method: GET
        MedicalAskApi:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /medical/ask
            Method: POST
  ClinicalReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-clinical-review-api'
      CodeUri: lambda_package/
      Handler: backend.clinical_review.handler.handler
      Environment:
        Variables:
          PHARMACARE_CASES_TABLE: !Ref ClinicalCasesTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ClinicalCasesTableName
      Events:
        SubmitCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /cases
            Method: POST
        ReadCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /cases/{case_id}
            Method: GET
        ListCases:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /doctor/cases
            Method: GET
        DecideCase:
          Type: Api
          Properties:
            RestApiId: !Ref PharmaCareApi
            Path: /doctor/cases/{case_id}
            Method: POST
Outputs:
  PharmaCareApiUrl:
    Value: !Sub 'https://${PharmaCareApi}.execute-api.${AWS::Region}.amazonaws.com/Dev'
  ClinicalReviewApiUrl:
    Value: !Sub 'https://${PharmaCareApi}.execute-api.${AWS::Region}.amazonaws.com/Dev'
  PharmaCareFunctionName:
    Value: !Ref PharmaCareFunction
