
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PharmaCare AI - Serverless Medical RAG API

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key

  QdrantApiKey:
    Type: String
    NoEcho: true
    Description: Qdrant Cloud API key

  QdrantUrl:
    Type: String
    Description: Qdrant Cloud cluster URL

  ClaudeModel:
    Type: String
    Default: claude-haiku-5-5

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 28
    MemorySize: 1024
    Environment:
      Variables:
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        CLAUDE_MODEL: !Ref ClaudeModel
        QDRANT_API_KEY: !Ref QdrantApiKey
        QDRANT_URL: !Ref QdrantUrl
        QDRANT_COLLECTION: medical_knowledge

Resources:
  ClinicalCasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-clinical-cases'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - {AttributeName: case_id, AttributeType: S}
        - {AttributeName: status, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
      KeySchema:
        - {AttributeName: case_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedIndex
          KeySchema:
            - {AttributeName: status, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ClinicalUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
  PatientGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: patient, UserPoolId: !Ref ClinicalUserPool}
  DoctorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: doctor, UserPoolId: !Ref ClinicalUserPool}
  ClinicalUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ClinicalUserPool
      ClientName: !Sub '${AWS::StackName}-streamlit-client'
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Stage
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ClinicalUserPool.Arn
            Identity:
              Header: Authorization

  ClinicalReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-clinical-review-api'
      CodeUri: lambda_package/
      Handler: backend.clinical_review.handler.handler
      Environment:
        Variables:
          PHARMACARE_CASES_TABLE: !Ref ClinicalCasesTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy: {TableName: !Ref ClinicalCasesTable}
      Events:
        SubmitCase:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /cases
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

        ReadCase:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /cases/{case_id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        ListCases:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /doctor/cases
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        DecideCase:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /doctor/cases/{case_id}
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
  PharmaCareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pharmacare-ai-api
      CodeUri: lambda_package/
      Handler: backend.api.handler.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /health
            Method: GET

        MedicalAskApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /medical/ask
            Method: POST

Outputs:
  PharmaCareApiUrl:
    Description: Shared PharmaCare API Gateway URL
    Value: !Sub
      - 'https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/Stage'
      - ApiId: !Ref ServerlessRestApi

  PharmaCareFunctionName:
    Description: Lambda function name
    Value: !Ref PharmaCareFunction

  ClinicalReviewApiUrl:
    Description: Clinical review API URL using shared API Gateway
    Value: !Sub
      - 'https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/Stage'
      - ApiId: !Ref ServerlessRestApi

  ClinicalUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref ClinicalUserPool

  ClinicalUserPoolClientId:
    Description: Cognito application client ID
    Value: !Ref ClinicalUserPoolClient

  ClinicalCasesTableName:
    Description: DynamoDB clinical cases table name
    Value: !Ref ClinicalCasesTable